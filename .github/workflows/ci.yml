name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  basic-checks:
    name: Basic Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: bash ./scripts/bootstrap.sh

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Check Rust compilation
        run: cargo check --verbose

      - name: TypeScript type checking
        run: pnpm --dir ui run type-check

      - name: Build frontend
        run: pnpm --dir ui run build

  full-tests:
    name: Full Tests
    runs-on: ubuntu-latest
    if: contains(fromJson('["master", "develop"]'), github.ref_name) || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: bash ./scripts/bootstrap.sh

      - name: Run shared checks
        run: bash ./scripts/check.sh

      - name: Build project
        run: cargo build --verbose

      - name: Run all tests
        run: cargo test --verbose

  windows-release-script-tests:
    name: Windows Release Script Tests
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test fixed WebView2 release scripts
        shell: pwsh
        run: ./scripts/test-fixed-webview2-assets.ps1
