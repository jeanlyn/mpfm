name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to rebuild, for example v0.2.3"
        required: true
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}"
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Release Version Consistency
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Validate release tag and version metadata
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="$(bash ./scripts/release-version.sh --expect-tag "$RELEASE_TAG")"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-notes:
    name: Generate Release Notes
    needs: [check-version]
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Checkout workflow source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate grouped release notes
        id: notes
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.tag_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git fetch --force --tags
          bash ./scripts/release-notes.sh --tag "$RELEASE_TAG" --repo-url "$REPO_URL" > release-notes.md
          cat release-notes.md
          {
            echo 'body<<__MPFM_RELEASE_NOTES__'
            cat release-notes.md
            echo '__MPFM_RELEASE_NOTES__'
          } >> "$GITHUB_OUTPUT"

  publish-desktop:
    name: Desktop (${{ matrix.name }})
    needs: [check-version, release-notes]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            rust_target: aarch64-apple-darwin
            bundle_args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            os: macos-latest
            rust_target: x86_64-apple-darwin
            bundle_args: --target x86_64-apple-darwin --bundles dmg
          - name: Linux
            os: ubuntu-22.04
            rust_target: ""
            bundle_args: ""
          - name: Windows
            os: windows-2022
            rust_target: ""
            bundle_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.check-version.outputs.tag_name }}

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add release target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Setup MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release
          workspaces: |
            . -> target

      - name: Install project dependencies
        run: bash ./scripts/bootstrap.sh

      - name: Build and publish desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check-version.outputs.tag_name }}
          releaseName: mpfm ${{ needs.check-version.outputs.tag_name }}
          releaseBody: ${{ needs.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.bundle_args }}

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            binary_name: main_cli
            use_zig: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            binary_name: main_cli
            use_zig: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary_name: main_cli
            use_zig: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary_name: main_cli
            use_zig: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
            binary_name: main_cli.exe
            use_zig: false
            msvc_arch: amd64
          - os: windows-2022
            target: aarch64-pc-windows-msvc
            archive: zip
            binary_name: main_cli.exe
            use_zig: false
            msvc_arch: amd64_arm64

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.check-version.outputs.tag_name }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-release
          key: ${{ matrix.os }}-${{ matrix.target }}
          workspaces: |
            . -> target

      - name: Setup MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Zig
        if: ${{ matrix.use_zig }}
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.14.1
          curl -fL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        if: ${{ matrix.use_zig }}
        shell: bash
        run: cargo install --locked cargo-zigbuild

      - name: Build CLI with cargo-zigbuild
        if: ${{ matrix.use_zig }}
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release --bin main_cli --target "${{ matrix.target }}" --no-default-features --features cli

      - name: Build CLI with cargo (Unix)
        if: ${{ !matrix.use_zig && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin main_cli --target "${{ matrix.target }}" --no-default-features --features cli

      - name: Build CLI with cargo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --bin main_cli --target "${{ matrix.target }}" --no-default-features --features cli

      - name: Package CLI archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          OUT_DIR="dist"
          mkdir -p "$OUT_DIR"
          cp "target/$TARGET/release/${{ matrix.binary_name }}" "$OUT_DIR/main_cli"
          tar -C "$OUT_DIR" -czf "$OUT_DIR/main_cli-v${VERSION}-${TARGET}.tar.gz" main_cli

      - name: Package CLI archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.check-version.outputs.version }}"
          $target = "${{ matrix.target }}"
          $outDir = "dist"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "target/$target/release/${{ matrix.binary_name }}" "$outDir/main_cli.exe"
          Compress-Archive -Path "$outDir/main_cli.exe" -DestinationPath "$outDir/main_cli-v$version-$target.zip" -Force

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-cli-release:
    name: Publish CLI Release Assets
    needs: [check-version, release-notes, build-cli]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 1 -type f | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: mpfm ${{ needs.check-version.outputs.tag_name }}
          body: ${{ needs.release-notes.outputs.body }}
          draft: true
          prerelease: false
          overwrite_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-fixed-webview2:
    name: Fixed WebView2 Windows (${{ matrix.arch }})
    needs: [check-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc_arch: amd64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64

    runs-on: windows-2022

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.check-version.outputs.tag_name }}

      - name: Patch tagged fixed WebView2 publish script
        shell: pwsh
        run: |
          $path = "scripts/publish-fixed-webview2-assets.ps1"
          $content = Get-Content -Path $path -Raw
          $content = $content.Replace('$Tag:', '${Tag}:')
          Set-Content -Path $path -Value $content -NoNewline

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fixed-webview2-release
          key: windows-${{ matrix.target }}
          workspaces: |
            . -> target

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install project dependencies
        run: bash ./scripts/bootstrap.sh

      - name: Download and setup WebView2 Runtime
        shell: pwsh
        run: |
          ./scripts/setup-webview2-runtime.ps1 -Arch "${{ matrix.arch }}"

      - name: Build fixed WebView2 application
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RUSTFLAGS: -C target-feature=+crt-static
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          pnpm exec tauri build --config tauri.win.conf.json --target ${{ matrix.target }}

      - name: Rename artifacts with fixed-webview2 suffix
        shell: pwsh
        run: |
          ./scripts/rename-fixed-webview2-artifacts.ps1 -Target "${{ matrix.target }}"

      - name: Publish fixed WebView2 assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/publish-fixed-webview2-assets.ps1 `
            -Target "${{ matrix.target }}" `
            -Tag "${{ needs.check-version.outputs.tag_name }}"

  update-release-notes:
    name: Update Release Notes
    needs: [check-version, release-notes, publish-desktop, publish-cli-release, publish-fixed-webview2]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Update draft release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-version.outputs.tag_name }}
          RELEASE_BODY: ${{ needs.release-notes.outputs.body }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > release-notes.md
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
