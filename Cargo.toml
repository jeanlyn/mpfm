[package]
name = "multi-protocol-file-manager"
version = "0.3.0"
edition = "2021"
description = "A multi-protocol file manager built on OpenDAL"
authors = ["MultiProtocolFileManager <info@example.com>"]
license = "MIT"
default-run = "multi-protocol-file-manager"  # 添加这一行

[lib]
doctest = false

# 定义库目标
# [lib]
# name = "multi_protocol_file_manager"
# path = "src/lib.rs"

# 定义二进制目标
[[bin]]
name = "multi-protocol-file-manager"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "main_cli"
path = "src/main_cli.rs"
required-features = ["cli"]

[features]
default = ["desktop", "cli"]
cli = []
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-fs",
]

[dependencies]
opendal = { version = "0.53.1", features = ["services-s3", "services-fs", "services-ftp"] }
tokio = { version = "1.32", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
indicatif = "0.17"
prettytable-rs = "0.10"
uuid = { version = "1.5", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
zip = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Tauri dependencies
tauri = { version = "=2.5.1", features = [], optional = true }
tauri-plugin-clipboard-manager = { version = "=2.2.2", optional = true }
tauri-plugin-notification = { version = "2.0.0", features = [ "windows7-compat" ], optional = true }
tauri-plugin-dialog = { version = "=2.2.2", optional = true }
tauri-plugin-shell = { version = "=2.2.1", optional = true }
tauri-plugin-fs = { version = "=2.3.0", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dev-dependencies]
tempfile = "3.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
